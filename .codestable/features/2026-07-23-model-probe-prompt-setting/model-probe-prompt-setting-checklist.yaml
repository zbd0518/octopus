    name: 未配置时请求文本为 hi
    status: passed
    maps_to: N1
  - id: C2
    name: 自定义提示词注入测活请求
    status: passed
    maps_to: N2
  - id: C3
    name: 空/空白回退 hi
    status: passed
    maps_to: B1
  - id: C4
    name: 成功路径不校验模型回复内容
    status: passed
    maps_to: N3
  - id: C5
    name: 不影响 Key 巡检
    status: passed
    maps_to: R1
  - id: C6
    name: 无渠道级覆盖与期望回复配置
    status: passed
    maps_to: X1
  - id: C7
    name: Setting 读失败回退 hi 且不崩溃
    status: passed
